replicaCount: 1

image:
  repository: ghcr.io/mnorrsken/whatsmyip
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  # Comma separated header names to show. Empty shows all headers.
  include: ""
  # Comma separated header names to hide, e.g. "cookie,authorization".
  exclude: ""
  # Whois lookup API. The image default is http://ip-api.com/json.
  whoisBaseURL: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  # e.g. traefik.ingress.kubernetes.io/router.entrypoints: websecure
  annotations: {}
  hosts:
    - host: whatsmyip.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: whatsmyip-tls
  #    hosts:
  #      - whatsmyip.example.com

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 16Mi

nodeSelector: {}
tolerations: []
affinity: {}
