apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "whatsmyip.fullname" . }}
  labels:
    {{- include "whatsmyip.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "whatsmyip.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "whatsmyip.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "whatsmyip.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: whatsmyip
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -port=8080
            {{- with .Values.config.include }}
            - {{ printf "-include=%s" . | quote }}
            {{- end }}
            {{- with .Values.config.exclude }}
            - {{ printf "-exclude=%s" . | quote }}
            {{- end }}
          {{- with .Values.config.whoisBaseURL }}
          env:
            - name: WHOIS_BASE_URL
              value: {{ . | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Probes come from the kubelet (a private IP), so whois lookups are
          # skipped and no external call is made.
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
