name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet and test
        run: |
          go vet ./...
          go test -race ./...

  build-and-push:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # Same gate as CI, right before publishing: nothing with a fixable
      # vulnerability ships. The amd64 build is scanned; the push below
      # reuses its layers.
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: whatsmyip:scan

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: whatsmyip:scan
          scanners: vuln
          ignore-unfixed: true
          exit-code: '1'
          version: v0.76.1

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set chart version from tag
        run: |
          TAG_NO_V="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^version:.*/version: ${TAG_NO_V}/" charts/whatsmyip/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${TAG_NO_V}\"/" charts/whatsmyip/Chart.yaml

      - name: Lint and package
        run: |
          helm lint charts/whatsmyip
          helm package charts/whatsmyip -d .helm-packages

      - name: Push chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push .helm-packages/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-and-push, helm]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Release notes from CHANGELOG
        run: |
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION_NO_V" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## /          { exit }
            found                    { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG section for $VERSION_NO_V" >&2; exit 1; }
          cat >> notes.md <<EOT

          ## Install

          \`\`\`
          helm install whatsmyip oci://ghcr.io/${{ github.repository_owner }}/charts/whatsmyip --version ${VERSION_NO_V}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION_NO_V}
          \`\`\`
          EOT

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" --title "Release ${GITHUB_REF#refs/tags/}" \
            --notes-file notes.md
